name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run Windows unit and CLI tests
        run: cargo test --lib --bins --test cli_compat --test cli_process
      - name: Run complete Windows service integration suite
        run: cargo test --test windows_scm_smoke --test windows_service -- --nocapture --test-threads=1
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Package Windows x64 release
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($env:GITHUB_REF -notlike 'refs/tags/*') {
            $tag = 'manual-' + $env:GITHUB_SHA.Substring(0, 12)
          }
          $stage = Join-Path $env:RUNNER_TEMP 'nssm-rs-release'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/nssm-rs.exe $stage
          Copy-Item README.md, LICENSE, NOTICE $stage
          $archive = "nssm-rs-$tag-windows-x64.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -NoNewline -Encoding ascii "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: |
            nssm-rs-*-windows-x64.zip
            nssm-rs-*-windows-x64.zip.sha256
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $archive = "nssm-rs-$env:GITHUB_REF_NAME-windows-x64.zip"
          gh release create $env:GITHUB_REF_NAME $archive "$archive.sha256" --generate-notes
