name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - name: Exercise a complete SCM install-start-stop-remove flow
        if: runner.os == 'Windows'
        run: cargo test --test windows_scm_smoke -- --nocapture
      - run: cargo test --all-targets
      - run: cargo build --release
      - if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo check --target x86_64-pc-windows-gnu
