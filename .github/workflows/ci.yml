name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - name: Run Windows unit and CLI tests
        if: runner.os == 'Windows'
        run: cargo test --lib --bins --test cli_compat --test cli_process
      - name: Run complete Windows service integration suite
        if: runner.os == 'Windows'
        run: cargo test --test windows_scm_smoke --test windows_service -- --nocapture --test-threads=1
      - name: Run all tests on Linux
        if: runner.os == 'Linux'
        run: cargo test --all-targets
      - run: cargo build --release
      - if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo check --target x86_64-pc-windows-gnu
